name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [version-16]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - id: pages
        uses: actions/configure-pages@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
        env:
          THE_DOCS_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Prepare Pages artifact
        env:
          THE_DOCS_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          client_dir=".build/client"
          base_dir="${THE_DOCS_BASE_PATH#/}"
          base_dir="${base_dir%/}"
          rm -rf .pages
          mkdir .pages
          cp -R "$client_dir"/. .pages/
          if [ -n "$base_dir" ]; then
            cp -R "$client_dir/$base_dir"/. .pages/
            rm -rf ".pages/$base_dir"
          fi
          touch .pages/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
